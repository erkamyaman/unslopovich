name: Release

# Push a tag like v2.0.0 to publish that version to npm through trusted
# publishing (no token) and create the GitHub release from
# docs/releases/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Check the release notes exist
        run: test -f "docs/releases/$GITHUB_REF_NAME.md"

      - run: npm test

      # Trusted publishing: npm trusts this workflow through OpenID Connect, so
      # no token is stored anywhere. It needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
